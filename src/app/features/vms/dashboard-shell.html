<header class="app-header" [class.scrolled]="scrolled()" [attr.inert]="leaving() ? '' : null" [attr.aria-hidden]="leaving() ? 'true' : null">
  <div class="header-inner">
    <a class="brand" routerLink="/dashboard" aria-label="VMS Manager, dashboard"><img class="brand-light" [class.hidden]="theme.dark()" src="/resources/full-logo-dark.png" alt="VMS Manager" width="180" height="60"><img class="brand-dark" [class.visible]="theme.dark()" src="/resources/full-logo-white.png" alt="" aria-hidden="true" width="180" height="60"></a>
    <nav class="navigation" aria-label="Navegación principal">
      <a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page">Dashboard</a>
      <a routerLink="/vms" routerLinkActive="active" ariaCurrentWhenActive="page">Máquinas virtuales</a>
    </nav>
    <div class="account-actions">
      <app-theme-toggle />
      <button mat-button class="account-trigger" [matMenuTriggerFor]="accountMenu" [disabled]="leaving()" aria-label="Abrir menú de cuenta">
        <span class="avatar" aria-hidden="true">{{ initials() }}</span><span class="account-name">{{ accountName() }}</span>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <mat-menu #accountMenu="matMenu" xPosition="before">
        <div class="account-details"><strong>{{ accountName() }}</strong><span>{{ accountEmail() }}</span><small>{{ accountRole() }}</small></div>
        <button mat-menu-item (click)="$event.stopPropagation(); logout()" [disabled]="leaving() || machines.pendingIds().size > 0" [attr.aria-busy]="leaving()">
          @if(leaving()) { <app-button-spinner /> } @else {
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10 5H5v14h5M14 8l4 4-4 4M8 12h10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></svg>
          }
          {{ leaving() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
        </button>
      </mat-menu>
      @if(leaving()) { <span class="leaving" role="status">Cerrando sesión…</span> }
    </div>
  </div>
</header>
<div class="workspace" [attr.inert]="leaving() ? '' : null" [attr.aria-hidden]="leaving() ? 'true' : null"><router-outlet /></div>
<footer class="app-footer" [attr.aria-hidden]="leaving() ? 'true' : null"><div class="footer-brand"><img class="footer-light" [class.hidden]="theme.dark()" src="/resources/full-logo-dark.png" alt="VMS Manager" width="144" height="48"><img class="footer-dark" [class.visible]="theme.dark()" src="/resources/full-logo-white.png" alt="" aria-hidden="true" width="144" height="48"></div></footer>
@if(leaving()){<app-full-screen-loading message="Cerrando sesión…" />}
